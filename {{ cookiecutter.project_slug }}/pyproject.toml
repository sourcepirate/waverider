[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<7.0",
    "django-ninja>=1.7.1,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-decouple>=3.8,<4.0",
    "dj-database-url>=3.1,<4.0",
    "gunicorn>=26.0,<27.0",
    "django-guardian>=3.3,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "django-redis>=7.0,<8.0",
    "whitenoise[brotli]>=6.12,<7.0",
{% if cookiecutter.use_celery == 'y' %}
    "celery>=5.6.3,<6.0",
    "redis>=8.0,<9.0",
    "django-celery-beat>=2.9,<3.0",
    "django-celery-results>=2.6,<3.0",
{% endif %}
{% if cookiecutter.include_oauth2 == 'y' %}
    "django-oauth-toolkit>=3.2,<4.0",
    "requests-oauthlib>=2.0,<3.0",
    "social-auth-app-django>=6.0,<7.0",
{% endif %}
{% if cookiecutter.include_sentry == 'y' or 'sentry' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "sentry-sdk[django]>=2.58,<3.0",
{% endif %}
{% if 'datadog' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "ddtrace>=2.7,<4.0",
{% endif %}
{% if 'newrelic' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "newrelic>=9,<11",
{% endif %}
{% if 'opentelemetry' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-exporter-otlp>=1.30,<2.0",
    "opentelemetry-instrumentation-django>=0.51b0,<1.0",
    "opentelemetry-instrumentation-psycopg>=0.51b0,<1.0",
    "opentelemetry-instrumentation-celery>=0.51b0,<1.0",
    "opentelemetry-instrumentation-redis>=0.51b0,<1.0",
{% endif %}
]

[project.optional-dependencies]
dev = [
    "django-extensions>=4.1,<5.0",
    "django-debug-toolbar>=7.0,<8.0",
    "Werkzeug>=3.1,<4.0",
    "pytest>=9.1.1,<10.0",
    "pytest-django>=4.12,<5.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.15.20,<1.0",
    "pre-commit>=4.6,<5.0",
    "coverage>=7.14.3,<8.0",
]
prod = [
    "whitenoise[brotli]>=6.12,<7.0",
{% if cookiecutter.include_sentry == 'y' or 'sentry' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "sentry-sdk[django]>=2.58,<3.0",
{% endif %}
{% if 'datadog' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "ddtrace>=2.7,<4.0",
{% endif %}
{% if 'newrelic' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "newrelic>=9,<11",
{% endif %}
{% if 'opentelemetry' in cookiecutter.observability or 'all' in cookiecutter.observability %}
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-exporter-otlp>=1.30,<2.0",
    "opentelemetry-instrumentation-django>=0.51b0,<1.0",
    "opentelemetry-instrumentation-psycopg>=0.51b0,<1.0",
    "opentelemetry-instrumentation-celery>=0.51b0,<1.0",
    "opentelemetry-instrumentation-redis>=0.51b0,<1.0",
{% endif %}
]

[tool.uv]
package = true


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "{{ cookiecutter.project_slug }}.settings.local"
python_files = ["tests.py", "test_*.py"]

[tool.coverage.run]
source = ["{{ cookiecutter.project_slug }}"]
omit = ["*/tests/*", "*/migrations/*", "manage.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError"]
