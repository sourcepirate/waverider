; New Relic configuration file for {{ cookiecutter.project_name }}
; See https://docs.newrelic.com/docs/agents/python-agent/configuration/python-agent-configuration/

[global:newrelic]
; Required - set via environment variable
license_key = ${NEW_RELIC_LICENSE_KEY}
app_name = ${NEW_RELIC_APP_NAME:{{ cookiecutter.project_slug }}}
monitor_mode = true
log_file = /tmp/newrelic-python-agent.log
log_level = info
high_security = false
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
error_collector.enabled = true
browser_monitoring.auto_instrument = true

; Distributed tracing
distributed_tracing.enabled = true

; Environment specific overrides
[development:newrelic]
monitor_mode = false
log_level = debug

[production:newrelic]
monitor_mode = true

[staging:newrelic]
monitor_mode = true
